<!-- @dsCard group="Colors" viewport="700x150" name="Dark Theme Surfaces" subtitle="Charcoal base — add class='dark'" -->
<!DOCTYPE html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--body-bg);font-family:var(--font-body)}
.row{display:flex;gap:12px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius);border:1px solid var(--border)}
.n{display:block;font-size:11px;font-weight:600;color:var(--ink);margin-top:6px}
.h{display:block;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--body-bg)"></div><span class="n">Canvas</span><span class="h">#0E0E11</span></div>
<div class="sw"><div class="chip" style="background:var(--shell)"></div><span class="n">Shell</span><span class="h">#151518</span></div>
<div class="sw"><div class="chip" style="background:var(--surface)"></div><span class="n">Card</span><span class="h">#1E1E24</span></div>
<div class="sw"><div class="chip" style="background:var(--surface-muted)"></div><span class="n">Raised</span><span class="h">#24242A</span></div>
<div class="sw"><div class="chip" style="background:var(--kisum-600)"></div><span class="n">Accent text</span><span class="h">#CDB4F0</span></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><span class="n">Accent fill</span><span class="h">#8466AC</span></div>
</div>
</body></html>
