<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base unit — xs → 3xl" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-body)}
.row{display:flex;align-items:flex-end;gap:20px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--kisum-400);border-radius:2px;width:100%}
.n{font-size:11px;font-weight:700;color:var(--ink)}.h{font-size:10px;color:var(--muted)}</style>
</head><body>
<div class="row">
<div class="item" style="width:24px"><div class="bar" style="height:4px"></div><span class="n">xs</span><span class="h">4</span></div>
<div class="item" style="width:32px"><div class="bar" style="height:8px"></div><span class="n">sm</span><span class="h">8</span></div>
<div class="item" style="width:44px"><div class="bar" style="height:16px"></div><span class="n">md</span><span class="h">16</span></div>
<div class="item" style="width:56px"><div class="bar" style="height:24px"></div><span class="n">lg</span><span class="h">24</span></div>
<div class="item" style="width:68px"><div class="bar" style="height:32px"></div><span class="n">xl</span><span class="h">32</span></div>
<div class="item" style="width:88px"><div class="bar" style="height:48px"></div><span class="n">2xl</span><span class="h">48</span></div>
<div class="item" style="width:120px"><div class="bar" style="height:80px"></div><span class="n">3xl</span><span class="h">80</span></div>
</div>
</body></html>
