<!-- @dsCard group="Colors" viewport="700x150" name="Brand Purple Scale" subtitle="Anchor 600 = #8466AC — the Kisum accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-body)}
.row{display:flex;gap:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-subtle)}
.sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.n{font-size:10px;font-weight:700}.h{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="row">
<div class="sw" style="background:var(--kisum-50)"><span class="n" style="color:var(--kisum-800)">50</span><span class="h" style="color:var(--kisum-800)">#F3EEF8</span></div>
<div class="sw" style="background:var(--kisum-100)"><span class="n" style="color:var(--kisum-800)">100</span><span class="h" style="color:var(--kisum-800)">#E9DEF3</span></div>
<div class="sw" style="background:var(--kisum-200)"><span class="n" style="color:var(--kisum-900)">200</span><span class="h" style="color:var(--kisum-900)">#D8B9FF</span></div>
<div class="sw" style="background:var(--kisum-400)"><span class="n" style="color:#fff">400</span><span class="h" style="color:#fff">#9A7AFF</span></div>
<div class="sw" style="background:var(--kisum-600)"><span class="n" style="color:#fff">600 ·</span><span class="h" style="color:#fff">#8466AC</span></div>
<div class="sw" style="background:var(--kisum-700)"><span class="n" style="color:#fff">700</span><span class="h" style="color:#fff">#74579A</span></div>
<div class="sw" style="background:var(--kisum-800)"><span class="n" style="color:#fff">800</span><span class="h" style="color:#fff">#6A4D91</span></div>
<div class="sw" style="background:var(--kisum-900)"><span class="n" style="color:#fff">900</span><span class="h" style="color:#fff">#55397B</span></div>
</div>
</body></html>
