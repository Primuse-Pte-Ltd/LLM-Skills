<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-body);display:flex;gap:16px}
.panel{flex:1;height:110px;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-subtle)}</style>
</head><body>
<div class="panel" style="background:var(--surface)"><img src="../assets/logo.svg" style="height:30px"></div>
<div class="panel" style="background:var(--body-bg)"><img src="../assets/icon.svg" style="height:52px"></div>
<div class="panel" style="background:var(--kisum-600)"><img src="../assets/icon.svg" style="height:52px;filter:brightness(0) invert(1)"></div>
<div class="panel" style="background:var(--ink)"><img src="../assets/logo.svg" style="height:30px;filter:brightness(0) invert(1)"></div>
</body></html>
