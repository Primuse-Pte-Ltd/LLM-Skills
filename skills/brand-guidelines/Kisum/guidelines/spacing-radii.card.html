<!-- @dsCard group="Spacing" viewport="700x150" name="Corner Radii" subtitle="Button 6 · card 12 · pill full" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-body);display:flex;gap:20px;align-items:flex-end}
.item{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:72px;height:56px;background:var(--kisum-50);border:1.5px solid var(--kisum-600)}
.n{font-size:11px;font-weight:700;color:var(--ink)}.h{font-size:10px;color:var(--muted)}</style>
</head><body>
<div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="h">4px</span></div>
<div class="item"><div class="box" style="border-radius:var(--radius-btn)"></div><span class="n">button</span><span class="h">6px</span></div>
<div class="item"><div class="box" style="border-radius:var(--radius)"></div><span class="n">base</span><span class="h">8px</span></div>
<div class="item"><div class="box" style="border-radius:var(--radius-card)"></div><span class="n">card</span><span class="h">12px</span></div>
<div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="h">24px</span></div>
<div class="item"><div class="box" style="border-radius:var(--radius-full);width:56px;height:56px"></div><span class="n">full</span><span class="h">pill</span></div>
</body></html>
