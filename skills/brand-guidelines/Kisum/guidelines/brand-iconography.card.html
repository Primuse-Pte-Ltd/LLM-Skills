<!-- @dsCard group="Brand" viewport="700x150" name="Iconography — Lucide" subtitle="1.75–2px stroke, rounded caps/joins" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-body)}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:center;color:var(--ink)}
.i{display:flex;flex-direction:column;align-items:center;gap:6px}
.i svg{width:26px;height:26px}.n{font-size:10px;color:var(--muted)}
.p svg{color:var(--kisum-600)}</style>
</head><body>
<div class="row">
<div class="i"><i data-lucide="layout-dashboard"></i><span class="n">dashboard</span></div>
<div class="i"><i data-lucide="calendar"></i><span class="n">booking</span></div>
<div class="i p"><i data-lucide="sparkles"></i><span class="n">artists</span></div>
<div class="i"><i data-lucide="search"></i><span class="n">search</span></div>
<div class="i"><i data-lucide="bell"></i><span class="n">alerts</span></div>
<div class="i"><i data-lucide="send"></i><span class="n">enquiry</span></div>
<div class="i"><i data-lucide="bookmark"></i><span class="n">save</span></div>
<div class="i"><i data-lucide="trending-up" style="color:var(--success)"></i><span class="n">trend</span></div>
<div class="i"><i data-lucide="sliders-horizontal"></i><span class="n">refine</span></div>
<div class="i"><i data-lucide="chevrons-up-down"></i><span class="n">switcher</span></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons({attrs:{'stroke-width':2}});</script>
</body></html>
