<!-- @dsCard group="Colors" viewport="700x150" name="Semantic States" subtitle="Danger, success, warning — low-saturation tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-body)}
.row{display:flex;gap:16px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.solid{height:44px;border-radius:var(--radius);display:flex;align-items:center;padding:0 12px;color:#fff;font-size:12px;font-weight:600}
.tint{height:32px;border-radius:var(--radius);display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:600}
.h{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="row">
<div class="sw"><div class="solid" style="background:var(--danger)">Danger</div><div class="tint" style="background:var(--danger-tint);color:var(--danger)">Overdue chip</div><span class="h">#D34848 · hover #B53030</span></div>
<div class="sw"><div class="solid" style="background:var(--success)">Success</div><div class="tint" style="background:var(--success-tint);color:#15803D">Confirmed chip</div><span class="h">#16A34A</span></div>
<div class="sw"><div class="solid" style="background:var(--warning)">Warning</div><div class="tint" style="background:var(--warning-tint);color:var(--warning)">Pending chip</div><span class="h">#B45309</span></div>
</div>
</body></html>
