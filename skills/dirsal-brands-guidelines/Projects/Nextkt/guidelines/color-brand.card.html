<!-- @dsCard group="Colors" viewport="700x180" name="Brand Teal Family" subtitle="Primary #1C6E87 — action colour keyed to the logo" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body)}
.row{display:flex;border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--outline-variant)}
.sw{flex:1;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.n{font-size:10px;font-weight:700}.h{font-size:10px;opacity:.8;font-variant-numeric:tabular-nums}
.logo{display:flex;gap:10px;margin-top:10px;font-size:10px;color:var(--on-surface-variant);align-items:center}
.dot{width:12px;height:12px;border-radius:var(--radius-xs);display:inline-block;vertical-align:middle;margin-right:4px}</style>
</head><body>
<div class="row">
<div class="sw" style="background:var(--primary-fixed)"><span class="n" style="color:var(--on-primary-fixed)">primary-fixed</span><span class="h" style="color:var(--on-primary-fixed)">#CDEAF2</span></div>
<div class="sw" style="background:var(--primary-fixed-dim)"><span class="n" style="color:var(--on-primary-fixed)">fixed-dim</span><span class="h" style="color:var(--on-primary-fixed)">#A7D8E4</span></div>
<div class="sw" style="background:var(--primary-container)"><span class="n" style="color:#fff">container · hover</span><span class="h" style="color:#fff">#417292</span></div>
<div class="sw" style="background:var(--primary);flex:1.4"><span class="n" style="color:#fff">primary ·</span><span class="h" style="color:#fff">#1C6E87</span></div>
<div class="sw" style="background:var(--on-primary-fixed-variant)"><span class="n" style="color:#fff">fixed-variant</span><span class="h" style="color:#fff">#2A5566</span></div>
<div class="sw" style="background:var(--on-primary-fixed)"><span class="n" style="color:#fff">on-fixed</span><span class="h" style="color:#fff">#06222B</span></div>
</div>
<div class="logo"><span style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary)">Logo inks</span>
<span><i class="dot" style="background:var(--brand-teal)"></i>brand-teal #488790</span>
<span><i class="dot" style="background:var(--brand-steel)"></i>brand-steel #417292</span>
<span><i class="dot" style="background:var(--brand-navy)"></i>brand-navy #1D1E4C = text</span>
<span><i class="dot" style="background:var(--brand-mark)"></i>brand-mark #3E6F8F</span></div>
</body></html>
