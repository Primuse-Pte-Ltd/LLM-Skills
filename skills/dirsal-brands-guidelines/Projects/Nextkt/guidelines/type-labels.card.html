<!-- @dsCard group="Type" viewport="700x140" name="Labels & Eyebrows" subtitle="Caps 12/700 at 0.05em; micro 10px; UPPERCASE badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body);color:var(--on-surface)}
.row{display:flex;gap:28px;align-items:flex-start}
.c{display:flex;flex-direction:column;gap:8px}
.m{font-size:10px;color:var(--secondary)}
.caps{font-size:var(--text-label-caps);font-weight:700;letter-spacing:var(--tracking-caps);text-transform:uppercase}
.chip{display:inline-flex;flex-direction:column;align-items:center;background:var(--surface-card);border:1px solid var(--outline-variant);border-radius:var(--radius-card);padding:6px 10px}</style>
</head><body>
<div class="row">
<div class="c"><span class="m">label-caps · form labels</span><span class="caps" style="color:var(--on-surface-variant)">Email address</span></div>
<div class="c"><span class="m">eyebrow · teal</span><span class="caps" style="color:var(--primary)">OCT 24 • JAKARTA</span></div>
<div class="c"><span class="m">badge · 10/700</span><span style="font-size:var(--text-micro);font-weight:700;letter-spacing:var(--tracking-caps);text-transform:uppercase;background:var(--status-on-sale);color:#fff;padding:3px 8px;border-radius:var(--radius-xs);align-self:flex-start">On Sale</span></div>
<div class="c"><span class="m">date chip</span><span class="chip"><span style="font-size:var(--text-micro);font-weight:700;letter-spacing:var(--tracking-widest);color:var(--primary)">NOV</span><span style="font-size:20px;font-weight:800;line-height:1">02</span></span></div>
<div class="c"><span class="m">label-sm · 13/600</span><span style="font-size:var(--text-label-sm);font-weight:600">Order Summary</span></div>
</div>
</body></html>
