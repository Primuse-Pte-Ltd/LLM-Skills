<!-- @dsCard group="Brand" viewport="700x160" name="Logo on Surfaces" subtitle="Full colour on light; white knockout on navy, teal and photos" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body);display:flex;gap:16px}
.panel{flex:1;height:110px;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;border:1px solid var(--outline-variant);position:relative}
.tag{position:absolute;left:8px;bottom:6px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ko{filter:brightness(0) invert(1)}</style>
</head><body>
<div class="panel" style="background:var(--surface-card)"><img src="../assets/logo.svg" style="height:44px"><span class="tag" style="color:var(--secondary)">Card #FFF</span></div>
<div class="panel" style="background:var(--background)"><img src="../assets/icon.svg" style="height:52px"><span class="tag" style="color:var(--secondary)">Page · mark</span></div>
<div class="panel" style="background:var(--primary);border-color:transparent"><img class="ko" src="../assets/icon.svg" style="height:52px"><span class="tag" style="color:rgb(255 255 255/.75)">Teal · knockout</span></div>
<div class="panel" style="background:radial-gradient(120% 90% at 30% 15%,#488790 0%,#1D1E4C 58%,#06222B 100%);border-color:transparent"><img class="ko" src="../assets/logo.svg" style="height:40px"><span class="tag" style="color:rgb(255 255 255/.7)">Photo · knockout</span></div>
</body></html>
