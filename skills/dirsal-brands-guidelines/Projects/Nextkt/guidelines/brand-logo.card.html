<!-- @dsCard group="Brand" viewport="700x210" name="Logo, Wordmark & N Mark" subtitle="NexTicket lockup, text-only wordmark and the standalone N mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body);display:grid;grid-template-columns:1.6fr 1.6fr 1fr 1fr;gap:14px}
.p{height:92px;border-radius:var(--radius-card);border:1px solid var(--outline-variant);background:var(--surface-card);display:flex;align-items:center;justify-content:center}
.c{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin-top:8px}
.s{font-size:11px;color:var(--on-surface-variant);margin-top:2px;line-height:1.35}</style>
</head><body>
<div><div class="p"><img src="../assets/logo.svg" alt="Nextkt" style="height:44px"></div><div class="c">Lockup · logo.svg</div><div class="s">Steel N, teal "ex", navy "Ticket". 56px desktop header, 40px mobile app bar.</div></div>
<div><div class="p"><img src="../assets/textlogo.svg" alt="NexTicket wordmark" style="width:78%"></div><div class="c">Wordmark · textlogo.svg</div><div class="s">Text only, navy and teal. For tight horizontal slots.</div></div>
<div><div class="p"><img src="../assets/icon.svg" alt="" style="height:52px"></div><div class="c">N mark · icon.svg</div><div class="s">Single colour #3E6F8F.</div></div>
<div><div class="p" style="background:var(--brand-navy);border-color:transparent"><img src="../assets/logo-icon.svg" alt="" style="height:52px;filter:brightness(0) invert(1)"></div><div class="c">Knockout</div><div class="s">White via filter on dark or photo surfaces.</div></div>
</body></html>
