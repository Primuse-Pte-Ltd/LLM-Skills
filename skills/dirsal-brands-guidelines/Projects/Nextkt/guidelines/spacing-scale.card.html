<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="4px base · stack 8/16/32 · 24px gutter · 1280 container" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body);color:var(--on-surface)}
.row{display:flex;align-items:flex-end;gap:18px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--primary);border-radius:var(--radius-xs)}
.n{font-size:10px;font-weight:700}.v{font-size:10px;color:var(--secondary)}
.lay{display:flex;gap:10px;margin-top:16px;font-size:11px;color:var(--on-surface-variant);flex-wrap:wrap}
.lay b{color:var(--on-surface);font-weight:600}</style>
</head><body>
<div class="row">
<div class="s"><div class="bar" style="width:4px;height:4px"></div><span class="n">xs</span><span class="v">4</span></div>
<div class="s"><div class="bar" style="width:8px;height:8px"></div><span class="n">sm</span><span class="v">8</span></div>
<div class="s"><div class="bar" style="width:12px;height:12px"></div><span class="n">12</span><span class="v">12</span></div>
<div class="s"><div class="bar" style="width:16px;height:16px"></div><span class="n">md</span><span class="v">16</span></div>
<div class="s"><div class="bar" style="width:24px;height:24px"></div><span class="n">lg · gutter</span><span class="v">24</span></div>
<div class="s"><div class="bar" style="width:32px;height:32px"></div><span class="n">xl</span><span class="v">32</span></div>
<div class="s"><div class="bar" style="width:48px;height:48px"></div><span class="n">2xl · desktop margin</span><span class="v">48</span></div>
<div class="s"><div class="bar" style="width:64px;height:64px"></div><span class="n">3xl</span><span class="v">64</span></div>
</div>
<div class="lay"><span><b>Header</b> 96</span>·<span><b>App bar</b> 60</span>·<span><b>Tab bar</b> 96 incl. safe area</span>·<span><b>Controls</b> 40</span>·<span><b>Add-to-Cart</b> 60</span>·<span><b>Account nav</b> 256</span>·<span><b>Order summary</b> 380</span></div>
</body></html>
