<!-- @dsCard group="Colors" viewport="700x200" name="Dark Editorial Zones" subtitle="class='dark' — featured bands only; the storefront ships light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--background);font-family:var(--font-body)}
.dark.wrap{background:var(--background);border-radius:var(--radius-card);padding:14px;display:flex;gap:14px;align-items:stretch}
.row{display:flex;flex:1;border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--outline-variant)}
.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.n{font-size:10px;font-weight:700;color:var(--on-surface)}.h{font-size:10px;opacity:.75;color:var(--on-surface)}
.demo{width:200px;background:var(--surface-card);border-radius:var(--radius-card);padding:12px;border:1px solid var(--outline-variant)}
.k{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--link)}
.tt{font-size:16px;font-weight:700;color:var(--on-surface);margin:4px 0}.p{font-size:11px;color:var(--on-surface-variant)}
.btn{margin-top:8px;display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:var(--radius-btn)}</style>
</head><body>
<div class="dark wrap">
<div class="row">
<div class="sw" style="background:var(--background)"><span class="n">background</span><span class="h">#191C1D</span></div>
<div class="sw" style="background:var(--surface-container-low)"><span class="n">low</span><span class="h">#24282A</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="n">card</span><span class="h">#2E3132</span></div>
<div class="sw" style="background:var(--surface-container-high)"><span class="n">high</span><span class="h">#393D3F</span></div>
<div class="sw" style="background:var(--link)"><span class="n" style="color:#06222B">link</span><span class="h" style="color:#06222B">#A7D8E4</span></div>
</div>
<div class="demo"><div class="k">Featured Artist</div><div class="tt">Midnight Echoes</div><div class="p">Teal text becomes #A7D8E4; the fill stays #1C6E87.</div><span class="btn">Tour Dates</span></div>
</div>
</body></html>
