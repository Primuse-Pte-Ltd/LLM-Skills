<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nextkt · Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--font-body);background:var(--surface-container-high);color:var(--on-surface);display:flex;align-items:center;justify-content:center;gap:40px;padding:40px;min-height:100vh;-webkit-font-smoothing:antialiased}
  #root{display:flex;align-items:center;gap:40px}
  .phone{width:390px;height:844px;border-radius:44px;background:var(--background);position:relative;overflow:hidden;box-shadow:0 40px 80px rgb(29 30 76 / .28),0 0 0 10px #111;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .hs{display:flex;gap:var(--gutter);overflow-x:auto;scrollbar-width:none}
  .hs::-webkit-scrollbar{display:none}
  .side{width:300px;display:flex;flex-direction:column;gap:14px}
  .side h1{margin:0;font-size:var(--text-headline-md);font-weight:700;letter-spacing:var(--tracking-headline)}
  .side p{margin:0;font-size:var(--text-sm);line-height:1.5;color:var(--on-surface-variant)}
  a{color:var(--link);text-decoration:none}
</style>
</head><body>
<div id="root"></div>
