<div><div class="cap">Discover</div><div class="frame" id="a"></div></div>

<script type="text/babel">
const { MobileAppBar, MobileTabBar, EventRow, Tabs } = window.NextktDesignSystem_1c6e87;
function Frame({ start, cart }){
  const [t,setT]=React.useState(start);
  return (<>
    <MobileAppBar logoSrc="../../assets/logo.svg" cartCount={cart}/>
    <div className="body">
      <Tabs variant="chips" tabs={['All Events','Concerts','Festivals']} value="All Events"/>

      <EventRow month="NOV" day="15" title="Comedy Underground" venue="Kuningan City" price="From Rp 200.000" last/>
    </div>
    <MobileTabBar value={t} onChange={setT} safeArea={20} style={{height:76}}/>
  </>);
}
ReactDOM.createRoot(document.getElementById('a')).render(<Frame start="discover" cart={0}/>);
ReactDOM.createRoot(document.getElementById('b')).render(<Frame start="tickets" cart={2}/>);
</script>
