<!-- @dsCard group="Components" viewport="700x380" name="Navigation — Account nav & Tabs" subtitle="Sidebar items, header nav, filters, segmented" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-body);display:grid;grid-template-columns:240px 1fr;gap:28px}
.lbl{font-size:var(--text-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin:0 0 8px}
.stack>div{margin-bottom:18px}</style>
</head><body>
<div id="side"></div><div id="tabs" class="stack"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { NavItem, Tabs } = window.NextktDesignSystem_1c6e87;
function Side(){
  const [v,setV]=React.useState('My Tickets');
  const items=[['dashboard','Dashboard'],['stars','Points & Rewards'],['confirmation_number','My Tickets'],['person','Profile'],['shield','Security']];
  return (<div style={{display:'flex',flexDirection:'column',gap:4}}>
    {items.map(([i,l])=><NavItem key={l} icon={i} label={l} active={v===l} onClick={()=>setV(l)}/>)}
    <div style={{borderTop:'1px solid var(--outline-variant)',marginTop:8,paddingTop:8}}><NavItem icon="logout" label="Sign Out" danger/></div>
  </div>);
}
function T(){
  const [n,setN]=React.useState('Events'); const [c,setC]=React.useState('Concerts'); const [m,setM]=React.useState('Sign In');
  const cats=['All Events','Concerts','Festivals','Comedy','Theatre'];
  return (<>
    <div><p className="lbl">nav — desktop header</p><Tabs variant="nav" tabs={['Home','Events','Venues','Artists','Loyalty']} value={n} onChange={setN}/></div>
    <div><p className="lbl">underline — category filter</p><Tabs variant="underline" tabs={cats} value={c} onChange={setC}/></div>
    <div><p className="lbl">chips — mobile filter</p><Tabs variant="chips" tabs={cats.slice(0,3)} value={c} onChange={setC}/></div>
    <div style={{maxWidth:320}}><p className="lbl">segmented — auth</p><Tabs variant="segmented" tabs={['Sign In','Create Account']} value={m} onChange={setM}/></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('side')).render(<Side/>);
ReactDOM.createRoot(document.getElementById('tabs')).render(<T/>);
</script>
</body></html>
