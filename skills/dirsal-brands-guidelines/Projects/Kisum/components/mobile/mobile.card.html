<!-- @dsCard group="Components" viewport="700x360" name="Mobile — App bar & Tab bar" subtitle="Shell chrome, light + dark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--body-bg);font-family:var(--font-body);display:flex;gap:24px;justify-content:center}
.ms{font-family:'Material Symbols Outlined';font-size:24px;line-height:1}
.frame{width:300px;height:300px;border-radius:24px;overflow:hidden;border:1px solid var(--border);position:relative;display:flex;flex-direction:column}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.cap{font-size:var(--text-label-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:8px}</style>
</head><body>
<div><div class="cap">Light</div><div class="frame" style="background:var(--body-bg)" id="lightframe"></div></div>
<div class="dark"><div class="cap">Dark</div><div class="frame" style="background:var(--body-bg)" id="darkframe"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { MobileAppBar, MobileTabBar, StatCard, Badge } = window.KisumDesignSystem_ff14fa;
const M = (n) => <span className="ms">{n}</span>;
function Demo(){
  const [tab,setTab]=React.useState('dashboard');
  const items=[
    {key:'chat',label:'AI',icon:M('smart_toy')},
    {key:'artists',label:'Artists',icon:M('group')},
    {key:'dashboard',label:'Dashboard',icon:M('dashboard')},
    {key:'rankings',label:'Rankings',icon:M('leaderboard')},
  ];
  return (<>
    <MobileAppBar eyebrow="Dashboard" title="Welcome"
      brand={<img src="../../assets/icon.svg" style={{height:22}}/>}
      right={<span className="ms" style={{color:'var(--muted)'}}>notifications</span>} />
    <div className="body">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <StatCard label="Audience" value="2.4M" highlight style={{padding:12}} />
        <StatCard label="Offers" value="12" style={{padding:12}} />
      </div>
      <Badge tone="brand">Kisum AI Insight</Badge>
    </div>
    <MobileTabBar items={items} value={tab} onChange={setTab} />
  </>);
}
ReactDOM.createRoot(document.getElementById('lightframe')).render(<Demo/>);
ReactDOM.createRoot(document.getElementById('darkframe')).render(<Demo/>);
</script>
</body></html>
