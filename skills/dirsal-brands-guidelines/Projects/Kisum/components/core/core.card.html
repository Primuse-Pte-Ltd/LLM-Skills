<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--body-bg);font-family:var(--font-body)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.lbl{font-size:var(--text-label-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:2px}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Badge, Card, Avatar } = window.KisumDesignSystem_ff14fa;
const Bell = () => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
const Plus = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;
function App(){return (<div>
  <div className="row"><span className="lbl">Buttons</span>
    <Button variant="primary" iconLeft={<Plus/>}>New Booking</Button>
    <Button variant="outline" pill>Send Enquiry</Button>
    <Button variant="secondary">Details</Button>
    <Button variant="ghost" size="sm">Cancel</Button>
    <Button variant="destructive" size="sm">Unpublish</Button>
    <Button variant="primary" disabled>Disabled</Button>
  </div>
  <div className="row"><span className="lbl">Icon buttons · Badges</span>
    <IconButton label="a"><Bell/></IconButton>
    <IconButton variant="tint" label="b"><Bell/></IconButton>
    <IconButton variant="solid" label="c"><Plus/></IconButton>
    <Badge tone="brand">12</Badge>
    <Badge tone="success" dot>Confirmed</Badge>
    <Badge tone="danger" dot>Overdue</Badge>
    <Badge tone="warning">Pending</Badge>
    <Badge tone="neutral" uppercase pill={false}>Concert</Badge>
  </div>
  <div className="row" style={{alignItems:'stretch'}}><span className="lbl">Card · Avatar</span>
    <Card interactive padding={16} style={{flex:1,minWidth:220}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <Avatar name="Taylor Swift"/>
        <div><div style={{fontWeight:600,fontSize:'var(--text-body)'}}>Taylor Swift</div>
        <div style={{fontSize:'var(--text-label)',color:'var(--muted)'}}>13 Management</div></div>
      </div>
    </Card>
    <Card padding={16} style={{display:'flex',gap:8,alignItems:'center'}}>
      <Avatar name="Primuse Entertainment" square/>
      <Avatar name="LGM"/>
      <Avatar size="sm" name="A B"/>
    </Card>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
