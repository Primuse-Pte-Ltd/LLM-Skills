<!-- @dsCard group="Type" viewport="700x130" name="Labels & Eyebrows" subtitle="Uppercase metadata, count/status pills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-body);color:var(--ink);display:flex;gap:40px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:var(--text-label-sm);font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}
.label{font-size:var(--text-label);font-weight:600;letter-spacing:.02em;color:var(--text-body)}
.pill{font-size:var(--text-label-sm);font-weight:700;padding:2px 8px;border-radius:var(--radius-full);background:var(--kisum-50);color:var(--kisum-600)}
.tag{font-size:10px;color:var(--muted)}</style>
</head><body>
<div><div class="tag">Eyebrow · 11 · .15em</div><div class="eyebrow">Listing Via</div></div>
<div><div class="tag">Label · 12 · 600</div><div class="label">Booking fee</div></div>
<div><div class="tag">Count badge · 11</div><div class="pill">12</div></div>
</body></html>
