<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Surfaces" subtitle="Cool zinc/gray — the No-Cream Rule" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-body)}
.row{display:flex;gap:12px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius);border:1px solid var(--border)}
.n{display:block;font-size:11px;font-weight:600;color:var(--ink);margin-top:6px}
.h{display:block;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ink)"></div><span class="n">Ink</span><span class="h">#18181B</span></div>
<div class="sw"><div class="chip" style="background:var(--muted)"></div><span class="n">Muted</span><span class="h">#71717A</span></div>
<div class="sw"><div class="chip" style="background:var(--surface)"></div><span class="n">Surface</span><span class="h">#FFFFFF</span></div>
<div class="sw"><div class="chip" style="background:var(--body-bg)"></div><span class="n">Page (gray-50)</span><span class="h">#F9FAFB</span></div>
<div class="sw"><div class="chip" style="background:var(--shell)"></div><span class="n">Shell</span><span class="h">#F4F4F5</span></div>
<div class="sw"><div class="chip" style="background:var(--border)"></div><span class="n">Border</span><span class="h">#E5E7EB</span></div>
</div>
</body></html>
